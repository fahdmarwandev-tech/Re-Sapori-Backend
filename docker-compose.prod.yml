services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resapori-backend
    restart: always
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "127.0.0.1:8080:8080"
    # If using local docker DB instead of Supabase, uncomment below:
    # depends_on:
    #   - db

